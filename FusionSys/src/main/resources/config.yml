# ============================================================
#  FusionSys — конфигурация
# ============================================================

# Зачарования (Скорость для вагонетки, Спутник) — наборы датапака.
enchantments:
  datapack: "plugins/FusionSys/datapack"   # путь к готовому датапаку с зачарованиями и крафтами
  cart-speed: "fusionsys:cart_speed"       # id зачарования, уровни 1-3
  satel: "fusionsys:satel"                 # зачарование Спутник (стойки у границы мира деспавнятся)

# Зелья
potions:
  shrink-id: "fusionsys:shrink"    # зелье уменьшения
  grow-id: "fusionsys:grow"        # зелье увеличения
  shrink-scale-factor: 0.6         # множитель размера под уменьшением (цель ~1 блок)
  grow-scale-factor: 3.0          # множитель размера под увеличением (цель ~3 блока)
  shrink-duration: 30             # длительность в тиках
  grow-duration: 30

# Магнит (кастомный блок)
magnet:
  item-material: "LODESTONE"        # внешний вид блока магнита (ядро LODESTONE)
  max-attract-distance: 16          # радиус притяжения
  max-metal: 100                    # 100% = сильное притяжение

# Светящаяся кисть (проверка "кто поставил блок")
brush:
  fresh-seconds: 300                # до этого времени свечение "свежо" (яркое, уровень 0)
  mid-seconds: 3600                 # до этого времени — среднее (уровень 1), дальше слабее (уровень 2)

# Расы (игрок получает расу из конфига при входе; менять сам не может)
races:
  default-race: "human"
  human:
    display-name: "&eЧеловек"
    # размер модели относительно обычного игрока (1.0 = обычный)
    base-scale: 1.0
    # рост под эффектом келичения
    grow-scale-multiplier: 1.0
    # рост под эффектом уменьшения
    shrink-scale-multiplier: 1.0
    # насколько % игрок состоит из металла (0-100). Влияет на притяжение к магниту и помехи.
    metal-percent: 0
    # баффы: скрытый эффект зелья: имя, уровень, длительность(тики) — выдаётся постоянно
    buffs:
      - "SPEED:0:999999"
    # дебаффы (скрытый негативный эффект)
    debuffs: []
    # как блок магнита/металл влияет на сознание: darkness(темнота), fog(туман), static(помехи)
    # притяжение к магниту сильно при высоком metal-percent
  dwarf:
    display-name: "&6Дварф"
    base-scale: 0.85
    grow-scale-multiplier: 1.0
    shrink-scale-multiplier: 1.0
    metal-percent: 40
    buffs:
      - "HASTE:0:999999"
    debuffs:
      - "SLOWNESS:0:999999"
    armor: 1.0
  elf:
    display-name: "&aЭльф"
    base-scale: 1.1
    grow-scale-multiplier: 1.0
    shrink-scale-multiplier: 1.0
    metal-percent: 5
    buffs:
      - "JUMP_BOOST:1:999999"
    debuffs: []

# ============================================================
#  Динамический барьер — зона разрешённой территории
# ============================================================
barrier:
  # Центр и радиус разрешённой территории (в блоках)
  center-x: 0
  center-z: 0
  radius: 256
  # Ширина «слепой зоны» у границы, где искажается картинка и не работает элитра (блоков)
  distortion-zone: 30
  # Глубина за барьером, на которой наступает темнота, а затем смерть
  death-zone: 8
  # Мир, к которому применяется барьер (обычный мир). Пустое — все миры кроме void
  world: "world"
  # Сообщение при попытке покинуть зону
  blocked-message: "&cТы упёрся в невидимый барьер!"
  distort-message: "&7...пространство вокруг изгибается..."

# ============================================================
#  Измерение Void
# ============================================================
void:
  world-name: "void"
  # Масштаб координат между void и адом (1:1, так как 3 блока void = 3 блока в аду)
  scale-from-nether: 1.0
  # Высота слоя барьеров (пола мира) — мир из 1 слоя барьеров
  floor-y: 64
  enabled: true